[package]
name = "fullmeta-model-sdk"
version = "0.1.0"
edition = "2024"
description = "Rust client for the FullMeta model DLL"

[lib]
name = "fullmeta_model"

[dependencies]
fullmeta-core = { package = "fullmeta-core-sdk", path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
